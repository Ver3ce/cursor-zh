<!doctype html>
<html><head><meta charset="utf-8"><title>cursor-zh fixture</title></head>
<body>
  <div id="toolbar">
    <button id="b1" title="Send message">Send</button>
    <button id="b2" aria-label="Stop generation">Stop</button>
    <span id="mode">Agent</span>
    <span id="thought">Thought for 12s</span>
    <span id="files">3 files changed</span>
    <span id="loading">Loading...</span>
    <span id="unknown">Some Unknown Label</span>
    <span id="zw">Loading fonts...&#8288;</span>
    <span id="worked">Worked for 5m 16s</span>
    <span id="sum">2 files, ran 2 commands +22 -1</span>
    <span id="rm">Remove $d.city</span>
    <span id="ran">Ran type-check</span>
    <span id="ed">Editing zh-CN.json</span>
    <span id="ps">Get-ChildItem</span>
    <span id="plus">+ git status</span>
    <span id="var">$ProgressPreference</span>
    <span id="hotkey">Ctrl+Shift+N</span>
  </div>
  <input id="inp" placeholder="Plan, search, build anything" value="Accept">
  <div id="editor" contenteditable="true">Accept all</div>
  <pre id="pre">Reject all</pre>
  <div class="monaco-editor"><span>Keep all</span></div>
  <div id="host"></div>
  <div id="dyn"></div>
  <script>
    var root = document.getElementById('host').attachShadow({mode:'open'});
    root.innerHTML = '<span id="shadowText">Review changes</span>';
    setTimeout(function(){
      var b = document.createElement('button'); b.textContent = 'Accept all'; b.id='dynBtn';
      document.getElementById('dyn').appendChild(b);
      setTimeout(function(){ document.getElementById('mode').firstChild.nodeValue = 'Plan'; }, 200);
    }, 300);
  </script>
</body></html>
